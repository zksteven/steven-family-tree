const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
  const html=new TextDecoder().decode(pt);
  var gate=document.getElementById('gate');
  if(gate) gate.style.display='none';
  document.body.style.display='block';
  document.body.style.margin='0';
  var frame=document.createElement('iframe');
  frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff';
  frame.setAttribute('title','Steven Family Tree');
  document.body.appendChild(frame);
  frame.srcdoc=html;
  var tries=0;
  var watchdog=function(){
    var ready=false;
    try{
      var fd=frame.contentDocument;
      var chips=fd&&fd.getElementById('linechips');
      ready=!!(chips&&chips.children.length>0);
    }catch(_){ ready=false; }
    if(ready) return;
    tries++;
    if(tries<=3){ frame.srcdoc=html; setTimeout(watchdog,2500); }
  };
  setTimeout(watchdog,2500);
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  try{ sessionStorage.setItem('sft_pw',pw); await unlock(pw); }
  catch(_){ document.getElementById('err').textContent='That password did not work — try again.'; }
});
const saved=sessionStorage.getItem('sft_pw');
if(saved){ unlock(saved).catch(()=>sessionStorage.removeItem('sft_pw')); }
</script>
